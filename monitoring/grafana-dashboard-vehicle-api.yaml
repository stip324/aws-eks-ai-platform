apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-vehicle-api
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  vehicle-api.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "panels": [
        {
          "type": "timeseries",
          "title": "Request Rate by Endpoint",
          "id": 1,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total[5m])) by (exported_endpoint)",
              "legendFormat": "{{exported_endpoint}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "5xx Error Rate (%)",
          "id": 2,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "expr": "100 * sum(rate(http_requests_total{status_code=~\"5..\"}[5m])) / clamp_min(sum(rate(http_requests_total[5m])), 0.001)",
              "legendFormat": "5xx %",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "p95 Request Latency",
          "id": 3,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, exported_endpoint))",
              "legendFormat": "{{exported_endpoint}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Application Errors",
          "id": 4,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "targets": [
            {
              "expr": "sum(rate(vehicle_api_errors_total[5m])) by (exported_endpoint, status_code)",
              "legendFormat": "{{exported_endpoint}} {{status_code}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Pod CPU Usage",
          "id": 5,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"vehicle-platform\",pod=~\"vehicle-api.*\",container=\"vehicle-api\"}[5m])) by (pod)",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Pod Memory Working Set",
          "id": 6,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 16
          },
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace=\"vehicle-platform\",pod=~\"vehicle-api.*\",container=\"vehicle-api\"}) by (pod)",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Pod Restarts",
          "id": 7,
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 24
          },
          "targets": [
            {
              "expr": "sum(kube_pod_container_status_restarts_total{namespace=\"vehicle-platform\",pod=~\"vehicle-api.*\"}) by (pod)",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": [
        "vehicle-api",
        "kubernetes",
        "prometheus"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timezone": "browser",
      "title": "Vehicle API",
      "uid": "vehicle-api",
      "version": 1
    }
